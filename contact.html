<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 一志苑教育</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏与首页相同 -->
<nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="一志苑教育">
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">主页</a></li>
                <li><a href="success.html">成功案例</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="contact.html">联系我们</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- 联系我们内容 -->
    <section class="contact-section">
        <div class="container">
            <h1>联系我们</h1>
            <p class="subtitle">我们随时准备为您解答留学相关问题</p>
            
            <div class="contact-content">
                <div class="contact-info">
                    <h2>联系方式</h2>
                    <div class="info-item">
                        <h3>咨询电话</h3>
                        <p>185-1131-9649</p>
                        <p>周一至周日 9:00-21:00</p>
                    </div>
                    <div class="info-item">
                        <h3>电子邮箱</h3>
                        <p>info@yizhiyuan.edu</p>
                        <p>24小时内回复</p>
                    </div>
                    <div class="info-item">
                        <h3>办公地址</h3>
                        <p>北京市朝阳区十里堡1号恒泰大厦B座</p>
                        <p>北京市顺义区金色河畔高尔夫练习场</p>
                        <p>预约来访请提前电话联系</p>
                    </div>
                </div>
                
                <div class="contact-form">
                    <h2>在线咨询</h2>
                    <form id="consultation-form">
                        <div class="form-group">
                            <label for="name">姓名</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">电话</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="student-grade">学生年级</label>
                            <select id="student-grade" name="student-grade">
                                <option value="junior-high">初中</option>
                                <option value="high-school">高中</option>
                                <option value="university">大学</option>
                                <option value="graduate">研究生</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="target-country">目标留学国家</label>
                            <select id="target-country" name="target-country">
                                <option value="usa">美国</option>
                                <option value="uk">英国</option>
                                <option value="canada">加拿大</option>
                                <option value="australia">澳大利亚</option>
                                <option value="others">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message">咨询内容</label>
                            <textarea id="message" name="message" rows="4"></textarea>
                        </div>
                        <button type="submit" class="submit-button">提交咨询</button>
                    </form>
                </div>
            </div>
            
            <div class="map-section">
                <h2>我们的位置</h2>
                <div class="map-container">
                    <iframe src="https://maps.google.com/maps?q=北京市朝阳区十里堡1号恒泰大厦B座&output=embed" frameborder="0" style="border:0" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- 底部与首页相同 -->
</body>
</html>
