<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本留学 - 一志苑教育</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="一志苑教育">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">主页</a></li>
                <li><a href="japan.html" class="active">日本留学</a></li>
                <li><a href="application.html">留学申请</a></li>
                <li><a href="elite.html">菁英计划</a></li>
                <li><a href="about.html">关于我们</a></li>
            </ul>
        </div>
    </nav>

    <!-- 英雄区域 -->
    <section class="hero">
        <div class="container">
            <h1>日本留学全方案</h1>
            <p>从高中到研究生，全方位规划您的日本求学之路</p>
        </div>
    </section>

    <!-- 日本留学项目 -->
    <section class="programs-section">
        <div class="container">
            <h2>日本留学项目</h2>
            <div class="program-tabs">
                <button class="tab-button active" data-tab="high-school">日本高中</button>
                <button class="tab-button" data-tab="university">日本大学</button>
                <button class="tab-button" data-tab="graduate">大学院</button>
                <button class="tab-button" data-tab="sgu">SGU项目</button>
            </div>
            
            <div class="tab-content active" id="high-school">
                <div class="program-content">
                    <div class="program-image">
                        <img src="images/japan-high-school.jpg" alt="日本高中留学">
                    </div>
                    <div class="program-details">
                        <h3>日本高中留学</h3>
                        <ul>
                            <li>全日本顶尖私立高中直招</li>
                            <li>寄宿制/走读制多种选择</li>
                            <li>日语零基础到N2快速通道</li>
                            <li>文化适应与生活辅导</li>
                            <li>大学升学全程规划</li>
                        </ul>
                        <a href="about.html#contact-section" class="cta-button">咨询详情</a>
                    </div>
                </div>
            </div>
            
            <div class="tab-content" id="university">
                <div class="program-content">
                    <div class="program-image">
                        <img src="images/japan-university.jpg" alt="日本大学留学">
                    </div>
                    <div class="program-details">
                        <h3>日本大学留学</h3>
                        <ul>
                            <li>东京大学、早稻田等名校EJU辅导</li>
                            <li>日语+专业课程双轨制培训</li>
                            <li>校内考面试特训</li>
                            <li>推荐入学制度申请</li>
                            <li>奖学金申请指导</li>
                        </ul>
                        <a href="contact.html" class="cta-button">咨询详情</a>
                    </div>
                </div>
            </div>
            
            <!-- 其他选项卡内容类似 -->
        </div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
        <!-- 与首页相同的页脚内容 -->
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
